# BlockMiner — BTCPay Server
#
# The supported production stack is NOT defined here. It is generated by the
# official project after you run (on Linux, as root):
#   cp docker/btcpay/env.example docker/btcpay/env   # then edit env
#   sudo bash docker/btcpay/install-btcpay.sh
#
# That clones https://github.com/btcpayserver/btcpayserver-docker and runs
# btcpay-setup.sh, which produces the real compose under Generated/ and sets
# BTCPAY_DOCKER_COMPOSE in btcpay-env.sh (see upstream docs).
#
# This file exists only so the folder is visible in the repo; use install-btcpay.sh
# and reinstall-btcpay.sh (after changing docker/btcpay/env).

name: blockminer-btcpay-docs
services:
  noop:
    image: alpine:3.20
    profiles: ["documentation-only"]
    restart: "no"
    command: ["sh", "-c", "echo Read docker/btcpay/LEIAME-PT.txt && exit 0"]
