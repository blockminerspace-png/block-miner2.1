# Official production stack — exactly these 6 containers (fixed names via container_name):
#   block-miner-db, block-miner-redis, block-miner-app, block-miner-worker, block-miner-nginx, block-miner-telegram-worker
# Production deploy: python3 scripts/vm-deploy-local-over-ssh.py
# Do not run BTCPay/support compose on the same host without stopping them first.
# Optional `.env` (gitignored) is loaded after `.env.production` so overrides win in containers.
name: block-miner

services:
  db:
    container_name: block-miner-db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: blockminer
      POSTGRES_PASSWORD: blockminer_password
      POSTGRES_DB: blockminer_db
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockminer -d blockminer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: block-miner-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    container_name: block-miner-app
    build:
      context: .
      args:
        VITE_DISABLE_ADBLOCK_DETECTION: ${VITE_DISABLE_ADBLOCK_DETECTION:-}
        # Baked at client build in Dockerfile; must be in shell env or use:
        #   docker compose --env-file .env.production build app
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
      # Avoid Postgres transaction + advisory lock on every rate-limited API call (single app process).
      API_RATE_LIMIT_USE_MEMORY: "${API_RATE_LIMIT_USE_MEMORY:-true}"
      AUTH_LOCKOUT_USE_MEMORY: "${AUTH_LOCKOUT_USE_MEMORY:-true}"
      PG_POOL_MAX: "${PG_POOL_MAX:-40}"
      PG_POOL_CONNECTION_TIMEOUT_MS: "${PG_POOL_CONNECTION_TIMEOUT_MS:-30000}"
      PG_POOL_IDLE_MS: "${PG_POOL_IDLE_MS:-45000}"
      SOCKET_PING_INTERVAL_MS: "${SOCKET_PING_INTERVAL_MS:-30000}"
      SOCKET_PING_TIMEOUT_MS: "${SOCKET_PING_TIMEOUT_MS:-180000}"
      SOCKET_CONNECT_TIMEOUT_MS: "${SOCKET_CONNECT_TIMEOUT_MS:-120000}"
      SOCKET_MAX_HTTP_BUFFER_SIZE: "${SOCKET_MAX_HTTP_BUFFER_SIZE:-1048576}"
      VITE_SOCKET_TIMEOUT_MS: "${VITE_SOCKET_TIMEOUT_MS:-180000}"
      START_PHD_IN_APP_CONTAINER: "${START_PHD_IN_APP_CONTAINER:-false}"
      PHD_PORT: "${PHD_PORT:-3847}"
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

  worker:
    container_name: block-miner-worker
    build:
      context: .
      args:
        VITE_DISABLE_ADBLOCK_DETECTION: ${VITE_DISABLE_ADBLOCK_DETECTION:-}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      PG_POOL_MAX: "${WORKER_PG_POOL_MAX:-12}"
      PG_POOL_CONNECTION_TIMEOUT_MS: "${PG_POOL_CONNECTION_TIMEOUT_MS:-30000}"
      PG_POOL_IDLE_MS: "${PG_POOL_IDLE_MS:-45000}"
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
    command: ["node", "dist/server/jobs/runBlockminerWorker.js"]

  telegram-worker:
    container_name: block-miner-telegram-worker
    image: block-miner-worker
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
    restart: unless-stopped
    command: ["node", "services/telegram-proof-worker/telegramProofWorker.js"]

  nginx:
    container_name: block-miner-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:rw
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
