name: block-miner

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: blockminer
      POSTGRES_PASSWORD: blockminer_password
      POSTGRES_DB: blockminer_db
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  phd:
    build: .
    command: ["node", "server/phdServer.js"]
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
    restart: unless-stopped

  app:
    build:
      context: .
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
      - phd
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    restart: unless-stopped

  support-admin:
    build:
      context: .
    container_name: blockminer-support-admin
    ports:
      - "127.0.0.1:1001:3000"
    depends_on:
      - db
      - phd
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_MODE: support-admin
      ADMIN_ONLY_MODE: "true"
      PORT: 3000
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:rw
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
      - support-admin
    restart: unless-stopped

volumes:
  postgres_data:
