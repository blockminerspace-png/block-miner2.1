# Fixed Compose project name so container names are always block-miner-{service}-1
# regardless of clone directory (e.g. /root/block-miner-v3 vs /root/block-miner).
name: block-miner

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: blockminer
      POSTGRES_PASSWORD: blockminer_password
      POSTGRES_DB: blockminer_db
    # Host publish: default 5432. On a shared VM with another Postgres on 5432, set DB_PUBLISH_PORT (e.g. 55432).
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Optional: custodial Polygon HD deposit addresses (BIP-44). Set POLYGON_HD_DEPOSIT_ENABLED=1 and secrets in .env.production.
  phd:
    build: .
    command: ["node", "server/phdServer.js"]
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PHD_PORT: 3847
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_DISCORD_URL: ${VITE_DISCORD_URL:-}
        VITE_TELEGRAM_URL: ${VITE_TELEGRAM_URL:-}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_PUBLIC_WALLET_APP_URL: ${VITE_PUBLIC_WALLET_APP_URL:-https://blockminer.space}
        VITE_POLYGON_RPC_URL: ${VITE_POLYGON_RPC_URL:-}
        VITE_YOUTUBE_URL: ${VITE_YOUTUBE_URL:-}
        VITE_LIVE_SERVER_YOUTUBE_ID: ${VITE_LIVE_SERVER_YOUTUBE_ID:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_SITE_KEY_LOGIN: ${VITE_TURNSTILE_SITE_KEY_LOGIN:-}
        VITE_TURNSTILE_SITE_KEY_REGISTER: ${VITE_TURNSTILE_SITE_KEY_REGISTER:-}
        VITE_TURNSTILE_DUMMY_FALLBACK: ${VITE_TURNSTILE_DUMMY_FALLBACK:-}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      # Override the DATABASE_URL to point to the docker-compose 'db' service
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: 7
      BACKUP_INTERVAL_HOURS: 24
      BACKUP_CLOUD_ENABLED: ${BACKUP_CLOUD_ENABLED:-false}
      BACKUP_CLOUD_REMOTE: ${BACKUP_CLOUD_REMOTE:-}
      PHD_SERVICE_URL: ${PHD_SERVICE_URL:-}
      PHD_INTERNAL_TOKEN: ${PHD_INTERNAL_TOKEN:-}
      POLYGON_HD_DEPOSIT_ENABLED: ${POLYGON_HD_DEPOSIT_ENABLED:-0}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
      - /root/.config/rclone:/root/.config/rclone:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # Keep the reverse proxy available for production-style runs, but
    # don't start it by default in localhost development where certs may
    # not exist yet.
    profiles:
      - proxy
    ports:
      - "${NGINX_PUBLISH_HTTP:-80}:80"
      - "${NGINX_PUBLISH_HTTPS:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certs-btcpay:/etc/nginx/certs-btcpay:rw
      - ./certbot-www:/var/www/certbot:rw
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    # Self-sign btcpay.blockminer.space PEM if missing (browser warning until real LE in nginx/certs-btcpay).
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if ! command -v openssl >/dev/null 2>&1; then
          apk add --no-cache openssl
        fi
        mkdir -p /etc/nginx/certs-btcpay
        # Chrome requires SAN, not CN alone — otherwise NET::ERR_CERT_COMMON_NAME_INVALID.
        has_btcpay_san() {
          openssl x509 -in /etc/nginx/certs-btcpay/cert.pem -noout -text 2>/dev/null | grep -q "DNS:btcpay.blockminer.space"
        }
        if [ ! -s /etc/nginx/certs-btcpay/cert.pem ] || ! has_btcpay_san; then
          openssl req -x509 -nodes -days 60 -newkey rsa:2048 \
            -subj "/CN=btcpay.blockminer.space" \
            -addext "subjectAltName=DNS:btcpay.blockminer.space" \
            -keyout /etc/nginx/certs-btcpay/key.pem \
            -out /etc/nginx/certs-btcpay/cert.pem
        fi
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    restart: unless-stopped

volumes:
  postgres_data:

