# Stack: nginx + app + db (three containers). Polygon HD: set START_PHD_IN_APP_CONTAINER=true
# in .env.production so entrypoint runs server/phdServer.js inside the app container.
# Optional `.env` (gitignored) is loaded after `.env.production` so overrides win in containers.
name: block-miner

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: blockminer
      POSTGRES_PASSWORD: blockminer_password
      POSTGRES_DB: blockminer_db
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockminer -d blockminer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        VITE_DISABLE_ADBLOCK_DETECTION: ${VITE_DISABLE_ADBLOCK_DETECTION:-}
        # Baked at client build in Dockerfile; must be in shell env or use:
        #   docker compose --env-file .env.production build app
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
      # Avoid Postgres transaction + advisory lock on every rate-limited API call (single app process).
      API_RATE_LIMIT_USE_MEMORY: "${API_RATE_LIMIT_USE_MEMORY:-true}"
      PG_POOL_MAX: "${PG_POOL_MAX:-25}"
      START_PHD_IN_APP_CONTAINER: "${START_PHD_IN_APP_CONTAINER:-false}"
      PHD_PORT: "${PHD_PORT:-3847}"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        VITE_DISABLE_ADBLOCK_DETECTION: ${VITE_DISABLE_ADBLOCK_DETECTION:-}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://blockminer:blockminer_password@db:5432/blockminer_db?schema=public"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    restart: unless-stopped
    command: ["node", "dist/server/jobs/runBlockminerWorker.js"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:rw
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
